<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — 드카게임즈</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080a">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  .nf{min-height:100svh; display:grid; place-items:center; text-align:center; padding:120px var(--pad) 80px; position:relative; overflow:hidden}
  .nf::before{content:""; position:absolute; width:min(760px,90vw); aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle,rgba(255,138,61,.16),transparent 66%); top:-10%; left:50%; translate:-50% 0; filter:blur(20px)}
  .nf__inner{position:relative; max-width:560px}
  .nf__code{font-size:clamp(80px,18vw,150px); font-weight:800; letter-spacing:-.06em; line-height:1; color:rgba(255,255,255,.14)}
  .nf h1{margin-top:6px; font-size:clamp(24px,4vw,34px); font-weight:800; letter-spacing:-.03em}
  .nf p{margin-top:14px; color:var(--muted); font-size:15px}
  .nf__actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:30px}
</style>
</head>
<body>
<main class="nf">
  <div class="nf__inner">
    <p class="nf__code">404</p>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>아래에서 게임으로 바로 이동할 수 있습니다.</p>
    <div class="nf__actions">
      <a class="btn btn--light" href="/">스튜디오 홈</a>
      <a class="btn btn--ghost" href="/dorati/">도랏이</a>
      <a class="btn btn--ghost" href="/age-of-war/">전쟁의 시대</a>
    </div>
  </div>
</main>
</body>
</html>
