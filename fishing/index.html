    }else{
      const html = `<div class="spot-group"><h3><i class="bar"></i>병맛 · 탈것 <small>${junkC}/${JUNK_TOTAL}</small></h3>
        <div class="grid">${JUNK.map(gridHtml).join('')}</div></div>
        <p class="footnote">0 G짜리도 있고, KTX처럼 대박인 것도 있습니다.<br>탈것은 릴링이 묵직하게 걸립니다.</p>`;
      $('dexGrid').innerHTML = html;
    }
  }

  function renderGear(){
    let html = `<div class="shopHead"><div><b>장비 업그레이드</b><br><span>낚싯대 · 릴 · 줄 · 미끼</span></div>
      <div style="text-align:right"><b>${fmt(S.gold)} G</b><br><span>보유 골드</span></div></div>`;
    Object.keys(GEAR).forEach(k=>{
      const G = GEAR[k], lv = S.gear[k]||0, max = lv>=G.max, cost = gearCost(k);
      const can = !max && S.gold>=cost;
      html += `<div class="eqcard">
        <div class="eqicon">${G.icon}</div>
        <div class="eqbody">
          <h4>${G.name} <em>Lv.${lv}</em></h4>
          <p>${G.desc}</p>
          <div class="pips">${[0,1,2,3,4].map(i=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div>
        </div>
        <button class="buyBtn ${max?'max':''}" data-buy="${k}" ${max?'disabled':''} ${can?'':'disabled'}>

    html += `<p class="footnote">낚싯대·릴은 감는 효율을, 낚싯줄은 텐션을, 미끼는 희귀·전설 확률을 올려요.</p>`;
    $('shopBody').innerHTML = html;

  function renderSell(){
    const total = S.inv.reduce((a,b)=>a+(b.price||0),0);
    let html = `<div class="shopHead"><div><b>보관함 ${S.inv.length}개</b><br><span>합계 ${fmt(total)} G</span></div>
      <button class="sellAll" id="sellAllBtn" ${S.inv.length?'':'disabled'} style="${S.inv.length?'':'opacity:.45'}">전체 판매</button></div>`;
    if(!S.inv.length){
      html += `<div class="empty">보관함이 비어 있어요.<br>낚시해서 물고기를 모아 보세요.</div>`;
    }else{
      html += S.inv.map((it,i)=>{

        return `<div class="invrow">
          <div class="art">${Art.svgFor(sp)}</div>
          <div class="meta"><b>${escapeHtml(sp.name)}</b><span>${sp.art==='ktx'?'20,000cm':Math.round(it.size*10)/10+'cm'} · <b style="color:${(GRADES[it.grade||2]||GRADES[2]).color}">★${it.grade||2}</b> · ${rarityOf(sp).label}</span></div>

  function renderShop(){
    document.querySelectorAll('#shopSeg button').forEach(b=>b.classList.toggle('is-on', b.dataset.shop===shopTab));
    if(shopTab==='gear') renderGear(); else renderSell();
  }

  function renderSpots(){
    let html = `<div class="sheet-head" style="padding:0 0 10px;border:0;background:none">
      <h2>낚시터 <span class="cnt">${S.unlocked.length}/${SPOTS.length} 해금</span></h2></div>`;
    SPOTS.forEach(sp=>{
      const unlocked = S.unlocked.includes(sp.id);
      const cur = S.spot===sp.id;
      const can = S.gold >= sp.cost;
      html += `<button class="spotrow ${unlocked?'':'locked'} ${cur?'cur':''}" data-spot="${sp.id}">
        <div class="art" style="background:linear-gradient(145deg,${sp.color1},${sp.color2});color:#fff">${sp.icon}</div>
        <div class="meta"><b>${sp.name}</b><span>${sp.desc}</span></div>
        <div class="tail">${cur?'낚시 중':''
          }${!unlocked?`<span style="color:#9a6a00">${fmt(sp.cost)} G</span><small>해금</small>`:''}${unlocked&&!cur?'<span style="color:#0b7f7d">선택</span><small>이동</small>':''}</div>
      </button>`;
    });
    html += `<p class="footnote">낚시터마다 나오는 물고기와 병맛 아이템이 달라요.<br>심해에는 KTX가 있다는 소문이…</p>`;
    $('spotList').innerHTML = html;
  }

  function buyGear(k){
    const lv = S.gear[k]||0;
    if(lv>=GEAR.max){ toast('이미 최대로 업그레이드했어요'); return; }
    const cost = gearCost(k);
    if(S.gold < cost){ toast(`골드가 ${fmt(cost-S.gold)} G 부족해요`); return; }
    S.gold -= cost; S.gear[k] = lv+1; save();
    Sfx.buy(); renderGold(); renderGear(); renderHeader();
    toast(`${GEAR[k].name} Lv.${lv+1} 업그레이드 완료!`);
  }

  function sellAll(){
    if(!S.inv.length) return;
    const total = S.inv.reduce((a,b)=>a+(b.price||0),0);
    const n = S.inv.length;
    S.gold += total; S.sold += n; S.inv = []; save();
    Sfx.sell(); renderGold(); renderSell(); renderHeader();
    toast(`${n}개 판매 완료 · +${fmt(total)} G`, 2400);
  }

  function selectSpot(id){
    const sp = SPOTS.find(x=>x.id===id); if(!sp) return;
    if(S.unlocked.includes(id)){
      S.spot = id; save(); renderSpot(); renderSpots(); Scene.setSpot(id);
      toast(`${sp.name}로 이동했어요`);
      closeSheets();
      return;
    }
    if(S.gold < sp.cost){ toast(`해금에 ${fmt(sp.cost-S.gold)} G가 더 필요해요`); return; }
    S.gold -= sp.cost; S.unlocked.push(id); S.spot = id; save();
    Sfx.unlock(); renderGold(); renderSpot(); Scene.setSpot(id); renderHeader();
    toast(`${sp.name} 해금! 새로운 물고기를 만나러 가요`, 2600);
    closeSheets();
  }

  /* ---------- crank ---------- */
  const crankEl = $('crank'), rotEl = $('crankRot');
  const cr = {active:false, last:0, total:0};
  function angleAt(e){
    const r = crankEl.getBoundingClientRect();
    return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI;
  }
  function spinCrank(deg){
    if(g.mode!=='reel') return;
    cr.total += deg;
    rotEl.style.transform = `rotate(${cr.total.toFixed(1)}deg)`;
    applyCrank(deg);
  }
  crankEl.addEventListener('pointerdown', e=>{
    if(g.mode!=='reel'){ return; }
    e.preventDefault();
    Sfx.init(); Sfx.resume();
    cr.active = true; cr.last = angleAt(e); cr.total = cr.total||0;
    crankEl.classList.add('turning');
    try{ crankEl.setPointerCapture(e.pointerId); }catch(_){}
  });
  crankEl.addEventListener('pointermove', e=>{
    if(!cr.active || g.mode!=='reel') return;
    e.preventDefault();
    const a = angleAt(e);
    let d = a - cr.last;
    while(d>180) d-=360;
    while(d<-180) d+=360;
    cr.last = a;
    if(Math.abs(d) > 80) return;
    spinCrank(d);
  });
  function endCrank(){
    if(!cr.active) return;
    cr.active = false;
    crankEl.classList.remove('turning');
  }
  crankEl.addEventListener('pointerup', endCrank);
  crankEl.addEventListener('pointercancel', endCrank);
  crankEl.addEventListener('pointerleave', e=>{ if(cr.active && e.pointerType==='mouse' && e.buttons===0) endCrank(); });
  window.addEventListener('blur', ()=>{ endCrank(); g.keyHeld=false; });

  /* keyboard assist */
  window.addEventListener('keydown', e=>{
    if(e.code==='Space'){
      e.preventDefault();
      if(g.mode==='idle'){ doCast(); return; }
      if(g.mode==='reel'){ Sfx.init(); Sfx.resume(); g.keyHeld = true; }
    }
    if(e.code==='Escape'){
      document.querySelectorAll('.modal.is-on').forEach(m=>{ if(m.id!=='nickModal') m.classList.remove('is-on'); });
      closeSheets();
    }
  });
  window.addEventListener('keyup', e=>{ if(e.code==='Space') g.keyHeld=false; });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ g.keyHeld=false; endCrank(); saveNow(); } });

  $('castBtn').addEventListener('click', doCast);
  $('waitCancel').addEventListener('click', ()=>{
    if(g.mode!=='waiting' && g.mode!=='casting') return;
    g.mode='idle'; g.pending=null; Scene.reset(); showIdle(); say('줄을 회수했어요');
  });
  $('spotChip').addEventListener('click', ()=>openSheet('spotSheet'));
  $('dexChip').addEventListener('click', ()=>openSheet('dexSheet'));
  $('muteBtn').addEventListener('click', ()=>{
    S.muted = !S.muted; Sfx.init(); Sfx.setMuted(S.muted); renderMute(); save();
    if(!S.muted) Sfx.ui();
  });
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ if(t.dataset.tab==='fish') closeSheets(); else openSheet(t.dataset.sheet); });
  });
  document.querySelectorAll('[data-close]').forEach(b=>{
    b.addEventListener('click', ()=>closeSheets());
  });
  $('dexSeg').addEventListener('click', e=>{
    const b = e.target.closest('button[data-kind]'); if(!b) return;
    dexKind = b.dataset.kind; renderDex(); Sfx.ui();
  });
  $('shopSeg').addEventListener('click', e=>{
    const b = e.target.closest('button[data-shop]'); if(!b) return;
    shopTab = b.dataset.shop; renderShop(); Sfx.ui();
  });
  $('dexGrid').addEventListener('click', e=>{
    const b = e.target.closest('[data-dex]'); if(!b) return;
    const sp = ALL_BY_ID[b.dataset.dex]; const d = S.dex[sp.id];
    if(!d){ toast('아직 잡지 못한 도감이에요'); return; }
    openDetail(sp); Sfx.ui();
  });
  $('shopBody').addEventListener('click', e=>{
    const buy = e.target.closest('[data-buy]');
    if(buy){ buyGear(buy.dataset.buy); return; }
    if(e.target.closest('#sellAllBtn')){ sellAll(); return; }
    const sell = e.target.closest('[data-sell]');
    if(sell){
      const i = Number(sell.dataset.sell);
      const it = S.inv[i]; if(!it) return;
      const sp = ALL_BY_ID[it.id];
      S.gold += it.price||0; S.inv.splice(i,1); S.sold++; save();
      Sfx.sell(); renderGold(); renderSell(); renderHeader();
      toast(`${sp?sp.name:'아이템'} 판매 · +${fmt(it.price||0)} G`);
    }
  });
  $('spotList').addEventListener('click', e=>{
    const b = e.target.closest('[data-spot]'); if(!b) return;
    selectSpot(b.dataset.spot);
  });
  $('catchSell').addEventListener('click', sellCatchNow);
  $('catchKeep').addEventListener('click', keepCatch);
  $('detailClose').addEventListener('click', ()=>$('detailModal').classList.remove('is-on'));
  document.querySelectorAll('.modal').forEach(m=>{
    m.addEventListener('click', e=>{ if(e.target===m && m.id!=='nickModal' && m.id!=='catchModal') m.classList.remove('is-on'); });
  });

    $('detailArt').innerHTML = Art.svgFor(sp);
    $('detailName').textContent = sp.name;

      <div><span>최대 기록</span><b>${Number.isInteger(d.max)?fmt(d.max):(Math.round(d.max*10)/10)} cm</b></div>
      <div><span>잡은 횟수</span><b>${d.n}회</b></div>
      <div><span>기본 판매가</span><b>${fmt(sp.price)} G</b></div>`;
    $('detailModal').classList.add('is-on');
  }

  /* ---------- boot ---------- */
  $('nickStart').addEventListener('click', ()=>{
    const v = $('nickInput').value.trim();
    if(!v){ $('nickInput').focus(); $('nickErr').textContent = '닉네임을 입력해 주세요 (1~10자)'; return; }

    $('nickModal').classList.remove('is-on');
    renderHeader();
  });
  $('nickInput').addEventListener('keydown', e=>{ if(e.key==='Enter') $('nickStart').click(); });

  Scene.init($('scene'));
  Scene.setSpot(S.spot);
  Sfx.setMuted(!!S.muted);
  renderHeader(); renderMute();
  $('muteBtn').textContent = S.muted ? '🔇' : '🔊';
  if(S.nick){
    $('nickInput').value = S.nick;
  }else{
    $('nickModal').classList.add('is-on');
  }
  document.addEventListener('pointerdown', function once(){ Sfx.init(); Sfx.resume(); document.removeEventListener('pointerdown', once); });
  window.addEventListener('resize', ()=>Scene.resize());
  window.addEventListener('orientationchange', ()=>setTimeout(()=>Scene.resize(), 120));
  requestAnimationFrame(tick);
  saveNow();
})();
</script>
</body>
</html>
