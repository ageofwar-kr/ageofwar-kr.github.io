<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오피러스 카세트 — 화면 확인</title>
<style>
  body { margin: 0; background: #0d0c0b; color: #9a948a; font: 12px system-ui, sans-serif; padding: 16px; }
  .row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .box { position: relative; }
  .box > b { display: block; margin-bottom: 6px; font-weight: 600; color: #d8c451; font-family: ui-monospace, monospace; }
  .frame { transform-origin: top left; border: 0; background: #000; display: block; }
  .info { font-family: ui-monospace, monospace; font-size: 11px; margin-bottom: 4px; }
  .wrap { overflow: hidden; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  var SPECS = [
    { name: "mobile-portrait 390x844", w: 390, h: 844, scale: 0.62 },
    { name: "mobile-landscape 844x390", w: 844, h: 390, scale: 0.58 },
    { name: "desktop 1440x900", w: 1440, h: 900, scale: 0.42 }
  ];
  var bootMode = location.search.indexOf("boot") >= 0;
  var row = document.getElementById("row");

  SPECS.forEach(function (s) {
    var box = document.createElement("div");
    box.className = "box";
    var t = document.createElement("b");
    t.textContent = s.name;
    var info = document.createElement("div");
    info.className = "info";
    info.textContent = "loading...";
    var wrap = document.createElement("div");
    wrap.className = "wrap";
    wrap.style.width = (s.w * s.scale) + "px";
    wrap.style.height = (s.h * s.scale) + "px";

    var f = document.createElement("iframe");
    f.className = "frame";
    f.width = s.w;
    f.height = s.h;
    f.style.width = s.w + "px";
    f.style.height = s.h + "px";
    f.style.transform = "scale(" + s.scale + ")";
    f.src = "../?preview=" + s.name.replace(/\s/g, "");

    f.addEventListener("load", function () {
      var measure = function () {
        try {
          var d = f.contentDocument;
          var de = d.documentElement;
          var nav = d.querySelector("#monitor").getBoundingClientRect();
          var lcd = d.querySelector("#lcd").getBoundingClientRect();
          info.textContent = "scroll " + de.scrollWidth + "x" + de.scrollHeight +
            " / view " + f.contentWindow.innerWidth + "x" + f.contentWindow.innerHeight +
            " · nav " + Math.round(nav.width) + "x" + Math.round(nav.height) +
            " · lcd " + Math.round(lcd.width) + "x" + Math.round(lcd.height);
          if (bootMode) {
            d.querySelector("#monitor").classList.add("is-booting");
          }
        } catch (e) { info.textContent = "err " + e.message; }
      };
      setTimeout(measure, 100);
      setTimeout(measure, 1900);
      if (bootMode) setInterval(function () {
        try { f.contentDocument.querySelector("#monitor").classList.add("is-booting"); } catch (e) {}
      }, 300);
    });

    wrap.appendChild(f);
    box.appendChild(t);
    box.appendChild(info);
    box.appendChild(wrap);
    row.appendChild(box);
  });
</script>
</body>
</html>
